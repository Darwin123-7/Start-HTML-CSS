<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>

    <style>
        
        div {

          margin: 20px;
          padding: 20px;
          border: 5px solid black;
          display: inline-block;

        }

        .welcome, .blue-white {

          background-color: lightblue;
          color: white;

        }

        .about-us, .red-white{
          background-color: red;
          color: white;

        }

        .end, .thanks {

          color: white;
          background: green;

        }

        .khaki {
          border: solid khaki;
          background: solid white;
          color: black;
          font-size: 20px;
        }

  
    </style>

</head>
<body>
    
<div class="welcome">
  <h2 class="blue-white">Welcome</h2>
</div>

<div class="about-us">
  <h2 class="red-white">About us Page</h2>
</div>

<div class="end">
  <h2 class="thanks">Thank You</h2>
</div>


<button class="khaki">Click Me!</button>
</body>
</html>
